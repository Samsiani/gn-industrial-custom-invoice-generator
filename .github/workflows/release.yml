name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create plugin ZIP
        run: |
          mkdir -p /tmp/release/custom-woocommerce-invoice-generator
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            ./ /tmp/release/custom-woocommerce-invoice-generator/
          cd /tmp/release
          zip -r custom-woocommerce-invoice-generator.zip custom-woocommerce-invoice-generator/
          echo "ZIP: $(ls -lh custom-woocommerce-invoice-generator.zip)"

      - name: Create release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          files: /tmp/release/custom-woocommerce-invoice-generator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
